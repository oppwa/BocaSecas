<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marcador Futbol</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; width:100%; background:#000; font-family: Helvetica, Arial, sans-serif; overflow:hidden; }

  #topBar {
    position:fixed; top:0; left:0; right:0; height:44px;
    background:#111; display:flex; align-items:center; justify-content:space-between;
    padding:0 8px; z-index:20;
  }
  #topBar .modes { display:flex; }
  #topBar button, #topBar .modeBtn {
    background:#333; color:#fff; border:1px solid #555; border-radius:6px;
    padding:6px 10px; font-size:13px; margin-right:4px;
  }
  .modeBtn.active { background:#0a7a2f; border-color:#0a7a2f; }

  #wrapper {
    position:fixed; top:44px; left:0; right:0; bottom:0;
    display:flex; flex-direction:column;
  }

  #timerRow {
    flex:0 0 auto;
    background:#111; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 0 10px 0; border-bottom:2px solid #222;
  }
  #timerLabel { font-size:13px; opacity:0.6; margin-bottom:0px; }
  #timerDisplay { font-size:min(20vw, 140px); font-weight:bold; letter-spacing:1px; line-height:1; }

  #mainScreen {
    flex:1; display:flex; flex-direction:row; min-height:0;
  }
  .teamPanel {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; color:#fff;
  }
  .teamPanel.left { background:#0d3b66; }
  .teamPanel.right { background:#7a1024; }
  .teamName {
    font-size:22px; font-weight:bold; margin-bottom:6px; text-transform:uppercase;
    max-width:90%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .score { font-size:min(28vw,150px); font-weight:bold; line-height:1; margin:0; }
  .golHint { font-size:15px; opacity:0.7; margin-top:6px; }
  .minusBtn {
    position:absolute; bottom:12px; right:12px;
    background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.4);
    border-radius:6px; padding:8px 14px; font-size:14px;
  }

  #centerControls {
    width:26%; max-width:230px; min-width:150px;
    background:#0a0a0a; color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:8px;
  }
  #waitingLabel { font-size:13px; opacity:0.75; margin-top:10px; text-align:center; }
  .ctrlBtn {
    margin-top:10px; background:#333; color:#fff; border:1px solid #555; border-radius:8px;
    padding:14px 10px; font-size:16px; width:100%;
  }
  #btnPause.running { background:#8a1c1c; border-color:#8a1c1c; }
  #btnPause.paused { background:#0a7a2f; border-color:#0a7a2f; }

  #overlay {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9);
    color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:30; text-align:center; padding:20px;
  }
  #overlay.show { display:flex; }
  #overlayTitle { font-size:38px; font-weight:bold; margin-bottom:16px; }
  #overlaySub { font-size:20px; opacity:0.9; margin-bottom:26px; }
  #overlayButtons { display:flex; flex-wrap:wrap; justify-content:center; }
  .overlayBtn {
    background:#0a7a2f; color:#fff; border:none; border-radius:10px;
    padding:16px 26px; font-size:20px; margin:6px;
  }
  .overlayBtn.alt { background:#0d3b66; }
  .overlayBtn.coin { background:#8a6d1c; }

  #settingsPanel {
    position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a0a; color:#fff;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:40; padding:20px; overflow-y:auto;
  }
  #settingsPanel.show { display:flex; }
  #settingsPanel h2 { margin-bottom:14px; }
  #settingsPanel label { font-size:14px; opacity:0.7; align-self:flex-start; margin:8px 0 2px 0; }
  #settingsPanel input {
    font-size:20px; padding:10px; width:280px; max-width:80vw; border-radius:6px; border:none; margin-bottom:6px;
  }
  #settingsPanel .closeBtn {
    margin-top:20px; background:#0a7a2f; border:none; color:#fff; padding:14px 26px; border-radius:8px; font-size:18px;
  }

  #flashOverlay {
    position:fixed; inset:0; background:#ff0000; opacity:0; pointer-events:none;
    z-index:25; transition:opacity 0.15s ease;
  }
  #flashOverlay.on { opacity:0.55; }

  @media (orientation: portrait) {
    #timerDisplay { font-size:min(26vw,90px); }
    .score { font-size:min(30vw,80px); }
    .teamName { font-size:16px; }
    #centerControls { min-width:110px; }
    .ctrlBtn { font-size:13px; padding:10px 6px; }
  }
</style>
</head>
<body>

<div id="topBar">
  <div class="modes">
    <button class="modeBtn" id="btnMode2" onclick="setMode('2')">2 Eq.</button>
    <button class="modeBtn" id="btnMode3" onclick="setMode('3')">3 Eq.</button>
    <button class="modeBtn" id="btnMode4" onclick="setMode('4')">4 Eq.</button>
  </div>
  <button onclick="openSettings()">Nombres</button>
</div>

<div id="wrapper">
  <div id="timerRow">
    <div id="timerLabel">TIEMPO</div>
    <div id="timerDisplay">10:00</div>
  </div>

  <div id="mainScreen">
    <div class="teamPanel left" id="panelLeft" onclick="addGoal('left')">
      <div class="teamName" id="nameLeft">Equipo A</div>
      <div class="score" id="scoreLeft">0</div>
      <div class="golHint">Toca para GOL</div>
      <button class="minusBtn" onclick="event.stopPropagation(); addGoal('left', -1)">-1</button>
    </div>

    <div id="centerControls">
      <button class="ctrlBtn paused" id="btnPause" onclick="togglePause()">Iniciar</button>
      <button class="ctrlBtn" onclick="resetTime()">Reiniciar Tiempo</button>
      <div id="waitingLabel"></div>
    </div>

    <div class="teamPanel right" id="panelRight" onclick="addGoal('right')">
      <div class="teamName" id="nameRight">Equipo B</div>
      <div class="score" id="scoreRight">0</div>
      <div class="golHint">Toca para GOL</div>
      <button class="minusBtn" onclick="event.stopPropagation(); addGoal('right', -1)">-1</button>
    </div>
  </div>
</div>

<div id="flashOverlay"></div>

<div id="overlay">
  <div id="overlayTitle"></div>
  <div id="overlaySub"></div>
  <div id="overlayButtons"></div>
</div>

<div id="settingsPanel">
  <h2>Nombres de equipos</h2>
  <label>Equipo A</label>
  <input type="text" id="inputA" />
  <label>Equipo B</label>
  <input type="text" id="inputB" />
  <label id="labelC">Equipo C</label>
  <input type="text" id="inputC" />
  <label id="labelD">Equipo D</label>
  <input type="text" id="inputD" />
  <button class="closeBtn" onclick="saveSettings()">Guardar y Cerrar</button>
</div>

<script>
  var mode = '2';
  var scoreLeft = 0, scoreRight = 0;
  var timerSeconds = 0;
  var timerInterval = null;
  var running = false;

  var teamNames = { A:'Equipo A', B:'Equipo B', C:'Equipo C', D:'Equipo D' };
  var playingLeft = 'A', playingRight = 'B';
  var queue = [];

  var coinCallerSide = null;
  var coinCallerFace = null;
  var pendingWinnerSide = null;
  var flashInterval = null;

  function loadStorage() {
    try {
      var saved = localStorage.getItem('marcadorFutbolData');
      if (saved) {
        var d = JSON.parse(saved);
        if (d.teamNames) teamNames = d.teamNames;
        if (d.mode) mode = d.mode;
      }
    } catch (e) {}
  }
  function saveStorage() {
    try {
      localStorage.setItem('marcadorFutbolData', JSON.stringify({ teamNames: teamNames, mode: mode }));
    } catch (e) {}
  }

  function beep(freq, dur) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.value = 0.2;
      osc.start();
      setTimeout(function () { osc.stop(); ctx.close(); }, dur);
    } catch (e) {}
  }

  function whistleTone(duration, f1, f2) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(f1, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(f2, ctx.currentTime + duration / 1000);
      gain.gain.value = 0.25;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      setTimeout(function () { osc.stop(); ctx.close(); }, duration);
    } catch (e) {}
  }
  function whistleShort() { whistleTone(180, 1900, 2500); }
  function whistleLong() { whistleTone(700, 1800, 2900); }

  function startWarningFlash() {
    if (flashInterval) return;
    var on = false;
    var el = document.getElementById('flashOverlay');
    flashInterval = setInterval(function () {
      on = !on;
      el.className = on ? 'on' : '';
    }, 300);
  }
  function stopWarningFlash() {
    if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
    document.getElementById('flashOverlay').className = '';
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function formatTime(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return pad(m) + ':' + pad(sec);
  }

  function keysForMode(m) {
    if (m === '2') return ['A', 'B'];
    if (m === '3') return ['A', 'B', 'C'];
    return ['A', 'B', 'C', 'D'];
  }

  function renderNames() {
    document.getElementById('nameLeft').textContent = teamNames[playingLeft];
    document.getElementById('nameRight').textContent = teamNames[playingRight];
    document.getElementById('labelC').style.display = (mode === '2') ? 'none' : 'block';
    document.getElementById('inputC').style.display = (mode === '2') ? 'none' : 'block';
    document.getElementById('labelD').style.display = (mode === '4') ? 'block' : 'none';
    document.getElementById('inputD').style.display = (mode === '4') ? 'block' : 'none';
    if (mode === '2') {
      document.getElementById('waitingLabel').textContent = '';
    } else {
      var names = queue.map(function (k) { return teamNames[k]; });
      document.getElementById('waitingLabel').textContent = 'Espera: ' + names.join(', ');
    }
  }

  function renderScores() {
    document.getElementById('scoreLeft').textContent = scoreLeft;
    document.getElementById('scoreRight').textContent = scoreRight;
  }

  function renderTimer() {
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }

  function setMode(m) {
    mode = m;
    var keys = keysForMode(mode);
    playingLeft = keys[0];
    playingRight = keys[1];
    queue = keys.slice(2);
    scoreLeft = 0; scoreRight = 0;
    stopInterval();
    stopWarningFlash();
    timerSeconds = (mode === '2') ? 0 : 600;
    document.getElementById('btnMode2').className = 'modeBtn' + (mode === '2' ? ' active' : '');
    document.getElementById('btnMode3').className = 'modeBtn' + (mode === '3' ? ' active' : '');
    document.getElementById('btnMode4').className = 'modeBtn' + (mode === '4' ? ' active' : '');
    renderNames();
    renderScores();
    renderTimer();
    setPauseButton(false);
    saveStorage();
  }

  function setPauseButton(isRunning) {
    running = isRunning;
    var btn = document.getElementById('btnPause');
    if (running) { btn.textContent = 'Pausar'; btn.className = 'ctrlBtn running'; }
    else { btn.textContent = 'Iniciar'; btn.className = 'ctrlBtn paused'; }
  }

  function togglePause() {
    if (running) { stopInterval(); setPauseButton(false); stopWarningFlash(); }
    else { startInterval(); setPauseButton(true); }
  }

  function startInterval() { stopInterval(); timerInterval = setInterval(tick, 1000); }
  function stopInterval() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

  function tick() {
    if (mode === '2') { timerSeconds++; }
    else {
      timerSeconds--;
      if (timerSeconds <= 0) {
        timerSeconds = 0;
        stopInterval();
        setPauseButton(false);
        renderTimer();
        stopWarningFlash();
        whistleLong();
        setTimeout(handleTimeUp, 750);
        return;
      }
      if (timerSeconds <= 10) {
        startWarningFlash();
        whistleShort();
      } else {
        stopWarningFlash();
      }
    }
    renderTimer();
  }

  function resetTime() {
    stopInterval();
    setPauseButton(false);
    stopWarningFlash();
    timerSeconds = (mode === '2') ? 0 : 600;
    renderTimer();
  }

  function addGoal(side, delta) {
    if (delta === undefined) delta = 1;
    if (side === 'left') scoreLeft = Math.max(0, scoreLeft + delta);
    else scoreRight = Math.max(0, scoreRight + delta);
    renderScores();
    if (delta > 0) beep(880, 150);

    var threshold = (mode === '2') ? 3 : 2;
    if (scoreLeft >= threshold) return showRoundWinOverlay('left');
    if (scoreRight >= threshold) return showRoundWinOverlay('right');
  }

  function hideOverlay() { document.getElementById('overlay').className = ''; }

  function showRoundWinOverlay(side) {
    stopInterval();
    setPauseButton(false);
    stopWarningFlash();
    var winnerName = side === 'left' ? teamNames[playingLeft] : teamNames[playingRight];
    document.getElementById('overlayTitle').textContent = winnerName + ' GANA';
    var sub = 'Toca para el siguiente minipartido';
    if (mode !== '2' && queue.length > 0) {
      sub = 'Entra: ' + teamNames[queue[0]];
    }
    document.getElementById('overlaySub').textContent = sub;
    document.getElementById('overlayButtons').innerHTML = '<button class="overlayBtn" onclick="confirmNextRound(\'' + side +
