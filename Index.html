<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marcador Futbol</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; width:100%; background:#000; font-family: Helvetica, Arial, sans-serif; overflow:hidden; }

  #topBar {
    position:fixed; top:0; left:0; right:0; height:48px;
    background:#111; display:flex; align-items:center; justify-content:space-between;
    padding:0 10px; z-index:20;
  }
  #topBar button, #topBar .modeBtn {
    background:#333; color:#fff; border:1px solid #555; border-radius:6px;
    padding:8px 12px; font-size:14px;
  }
  .modeBtn.active { background:#0a7a2f; border-color:#0a7a2f; }

  #mainScreen {
    position:fixed; top:48px; left:0; right:0; bottom:0;
    display:flex; flex-direction:row;
  }
  .teamPanel {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; color:#fff;
  }
  .teamPanel.left { background:#0d3b66; }
  .teamPanel.right { background:#7a1024; }
  .teamName {
    font-size:24px; font-weight:bold; margin-bottom:6px; text-transform:uppercase;
    max-width:90%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .score {
    font-size:150px; font-weight:bold; line-height:1; margin:0;
  }
  .golHint { font-size:16px; opacity:0.7; margin-top:6px; }
  .minusBtn {
    position:absolute; bottom:14px; right:14px;
    background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.4);
    border-radius:6px; padding:8px 14px; font-size:14px;
  }

  #centerPanel {
    width:30%; max-width:280px; min-width:200px;
    background:#111; color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:10px; position:relative;
  }
  #timerDisplay { font-size:64px; font-weight:bold; letter-spacing:2px; }
  #timerLabel { font-size:13px; opacity:0.6; margin-bottom:4px; }
  #waitingLabel { font-size:14px; opacity:0.75; margin-top:10px; text-align:center; }
  .ctrlBtn {
    margin-top:12px; background:#333; color:#fff; border:1px solid #555; border-radius:8px;
    padding:12px 18px; font-size:16px; width:80%;
  }
  #btnPause.running { background:#8a1c1c; border-color:#8a1c1c; }
  #btnPause.paused { background:#0a7a2f; border-color:#0a7a2f; }

  #overlay {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.88);
    color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:30; text-align:center; padding:20px;
  }
  #overlay.show { display:flex; }
  #overlayTitle { font-size:40px; font-weight:bold; margin-bottom:20px; }
  #overlaySub { font-size:20px; opacity:0.85; margin-bottom:30px; }
  .overlayBtn {
    background:#0a7a2f; color:#fff; border:none; border-radius:10px;
    padding:18px 30px; font-size:22px; margin:8px;
  }
  .overlayBtn.alt { background:#0d3b66; }

  #settingsPanel {
    position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a0a; color:#fff;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:40; padding:20px;
  }
  #settingsPanel.show { display:flex; }
  #settingsPanel h2 { margin-bottom:14px; }
  #settingsPanel label { font-size:14px; opacity:0.7; align-self:flex-start; margin:8px 0 2px 0; }
  #settingsPanel input {
    font-size:20px; padding:10px; width:280px; max-width:80vw; border-radius:6px; border:none; margin-bottom:6px;
  }
  #settingsPanel .closeBtn {
    margin-top:20px; background:#0a7a2f; border:none; color:#fff; padding:14px 26px; border-radius:8px; font-size:18px;
  }

  @media (orientation: portrait) {
    .score { font-size:90px; }
    #timerDisplay { font-size:44px; }
    .teamName { font-size:18px; }
  }
</style>
</head>
<body>

<div id="topBar">
  <div>
    <button class="modeBtn" id="btnMode2" onclick="setMode('2')">2 Equipos</button>
    <button class="modeBtn" id="btnMode3" onclick="setMode('3')">3 Equipos</button>
  </div>
  <button onclick="openSettings()">Nombres / Ajustes</button>
</div>

<div id="mainScreen">
  <div class="teamPanel left" id="panelLeft" onclick="addGoal('left')">
    <div class="teamName" id="nameLeft">Equipo A</div>
    <div class="score" id="scoreLeft">0</div>
    <div class="golHint">Toca para GOL</div>
    <button class="minusBtn" onclick="event.stopPropagation(); addGoal('left', -1)">-1</button>
  </div>

  <div id="centerPanel">
    <div id="timerLabel">TIEMPO</div>
    <div id="timerDisplay">10:00</div>
    <button class="ctrlBtn paused" id="btnPause" onclick="togglePause()">Iniciar</button>
    <button class="ctrlBtn" onclick="resetTime()">Reiniciar Tiempo</button>
    <div id="waitingLabel"></div>
  </div>

  <div class="teamPanel right" id="panelRight" onclick="addGoal('right')">
    <div class="teamName" id="nameRight">Equipo B</div>
    <div class="score" id="scoreRight">0</div>
    <div class="golHint">Toca para GOL</div>
    <button class="minusBtn" onclick="event.stopPropagation(); addGoal('right', -1)">-1</button>
  </div>
</div>

<div id="overlay">
  <div id="overlayTitle"></div>
  <div id="overlaySub"></div>
  <div id="overlayButtons"></div>
</div>

<div id="settingsPanel">
  <h2>Ajustes</h2>
  <label>Equipo Izquierda</label>
  <input type="text" id="inputA" />
  <label>Equipo Derecha</label>
  <input type="text" id="inputB" />
  <label id="labelC">Equipo en espera (modo 3)</label>
  <input type="text" id="inputC" />
  <button class="closeBtn" onclick="saveSettings()">Guardar y Cerrar</button>
</div>

<script>
  var mode = '2';
  var scoreLeft = 0, scoreRight = 0;
  var timerSeconds = 0;
  var timerInterval = null;
  var running = false;

  var teams = { A: 'Equipo A', B: 'Equipo B', C: 'Equipo C' };
  // en modo 3: left/right son A/B jugando, C espera. Guardamos qué letra está en cada lado.
  var leftTeamKey = 'A', rightTeamKey = 'B', waitingTeamKey = 'C';

  function loadStorage() {
    try {
      var saved = localStorage.getItem('marcadorFutbolData');
      if (saved) {
        var d = JSON.parse(saved);
        if (d.teams) teams = d.teams;
        if (d.mode) mode = d.mode;
      }
    } catch (e) {}
  }
  function saveStorage() {
    try {
      localStorage.setItem('marcadorFutbolData', JSON.stringify({ teams: teams, mode: mode }));
    } catch (e) {}
  }

  function beep(freq, dur) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.value = 0.2;
      osc.start();
      setTimeout(function () {
        osc.stop();
        ctx.close();
      }, dur);
    } catch (e) {}
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function formatTime(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return pad(m) + ':' + pad(sec);
  }

  function renderNames() {
    if (mode === '2') {
      document.getElementById('nameLeft').textContent = teams.A;
      document.getElementById('nameRight').textContent = teams.B;
      document.getElementById('waitingLabel').textContent = '';
      document.getElementById('labelC').style.display = 'none';
      document.getElementById('inputC').style.display = 'none';
    } else {
      document.getElementById('nameLeft').textContent = teams[leftTeamKey];
      document.getElementById('nameRight').textContent = teams[rightTeamKey];
      document.getElementById('waitingLabel').textContent = 'Espera: ' + teams[waitingTeamKey];
      document.getElementById('labelC').style.display = 'block';
      document.getElementById('inputC').style.display = 'block';
    }
  }

  function renderScores() {
    document.getElementById('scoreLeft').textContent = scoreLeft;
    document.getElementById('scoreRight').textContent = scoreRight;
  }

  function renderTimer() {
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }

  function setMode(m) {
    mode = m;
    scoreLeft = 0; scoreRight = 0;
    leftTeamKey = 'A'; rightTeamKey = 'B'; waitingTeamKey = 'C';
    stopInterval();
    timerSeconds = (mode === '3') ? 600 : 0;
    document.getElementById('btnMode2').className = 'modeBtn' + (mode === '2' ? ' active' : '');
    document.getElementById('btnMode3').className = 'modeBtn' + (mode === '3' ? ' active' : '');
    renderNames();
    renderScores();
    renderTimer();
    setPauseButton(false);
    saveStorage();
  }

  function setPauseButton(isRunning) {
    running = isRunning;
    var btn = document.getElementById('btnPause');
    if (running) {
      btn.textContent = 'Pausar';
      btn.className = 'ctrlBtn running';
    } else {
      btn.textContent = 'Iniciar';
      btn.className = 'ctrlBtn paused';
    }
  }

  function togglePause() {
    if (running) {
      stopInterval();
      setPauseButton(false);
    } else {
      startInterval();
      setPauseButton(true);
    }
  }

  function startInterval() {
    stopInterval();
    timerInterval = setInterval(tick, 1000);
  }
  function stopInterval() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function tick() {
    if (mode === '2') {
      timerSeconds++;
    } else {
      timerSeconds--;
      if (timerSeconds <= 0) {
        timerSeconds = 0;
        stopInterval();
        setPauseButton(false);
        renderTimer();
        handleTimeUp();
        return;
      }
    }
    renderTimer();
  }

  function resetTime() {
    stopInterval();
    setPauseButton(false);
    timerSeconds = (mode === '3') ? 600 : 0;
    renderTimer();
  }

  function addGoal(side, delta) {
    if (delta === undefined) delta = 1;
    if (side === 'left') {
      scoreLeft = Math.max(0, scoreLeft + delta);
    } else {
      scoreRight = Math.max(0, scoreRight + delta);
    }
    renderScores();
    if (delta > 0) beep(880, 150);

    if (mode === '2') {
      if (scoreLeft >= 3) return showRoundWinOverlay('left');
      if (scoreRight >= 3) return showRoundWinOverlay('right');
    } else {
      if (scoreLeft >= 2) return showRoundWinOverlay('left');
      if (scoreRight >= 2) return showRoundWinOverlay('right');
    }
  }

  function showRoundWinOverlay(side) {
    stopInterval();
    setPauseButton(false);
    var winnerName = side === 'left' ? document.getElementById('nameLeft').textContent : document.getElementById('nameRight').textContent;
    document.getElementById('overlayTitle').textContent = winnerName + ' GANA';
    var sub = 'Toca para el siguiente minipartido';
    if (mode === '3') {
      var enteringKey = waitingTeamKey;
      sub = 'Entra: ' + teams[enteringKey];
    }
    document.getElementById('overlaySub').textContent = sub;
    document.getElementById('overlayButtons').innerHTML = '<button class="overlayBtn" onclick="confirmNextRound(\'' + side + '\')">Continuar</button>';
    document.getElementById('overlay').className = 'show';
  }

  function handleTimeUp() {
    if (scoreLeft === scoreRight) {
      document.getElementById('overlayTitle').textContent = 'TIEMPO TERMINADO';
      document.getElementById('overlaySub').textContent = 'Empate ' + scoreLeft + '-' + scoreRight + '. Elige quién se queda:';
      document.getElementById('overlayButtons').innerHTML =
        '<button class="overlayBtn alt" onclick="confirmNextRound(\'left\')">' + document.getElementById('nameLeft').textContent + ' se queda</button>' +
        '<button class="overlayBtn alt" onclick="confirmNextRound(\'right\')">' + document.getElementById('nameRight').textContent + ' se queda</button>';
      document.getElementById('overlay').className = 'show';
    } else {
      var winnerSide = scoreLeft > scoreRight ? 'left' : 'right';
      showRoundWinOverlay(winnerSide);
    }
  }

  function confirmNextRound(winnerSide) {
    document.getElementById('overlay').className = '';
    if (mode === '2') {
      scoreLeft = 0; scoreRight = 0;
      renderScores();
      return;
    }
    // modo 3: el ganador se queda, el perdedor sale, entra el que esperaba
    if (winnerSide === 'left') {
      waitingTeamKey = rightTeamKey;
      rightTeamKey = null;
    } else {
      waitingTeamKey = leftTeamKey;
      leftTeamKey = null;
    }
    var entering = null;
    // el que entra es el que estaba esperando ANTES de este cambio; lo guardamos aparte
    // recomputamos: buscamos la llave que no está en left/right actuales ni en waitingTeamKey recién asignado
    var allKeys = ['A', 'B', 'C'];
    var used = [leftTeamKey, rightTeamKey, waitingTeamKey].filter(function (k) { return k; });
    for (var i = 0; i < allKeys.length; i++) {
      if (used.indexOf(allKeys[i]) === -1) { entering = allKeys[i]; break; }
    }
    if (winnerSide === 'left') { rightTeamKey = entering; } else { leftTeamKey = entering; }

    scoreLeft = 0; scoreRight = 0;
    timerSeconds = 600;
    renderNames();
    renderScores();
    renderTimer();
    setPauseButton(false);
  }

  function openSettings() {
    document.getElementById('inputA').value = teams.A;
    document.getElementById('inputB').value = teams.B;
    document.getElementById('inputC').value = teams.C;
    document.getElementById('settingsPanel').className = 'show';
  }
  function saveSettings() {
    teams.A = document.getElementById('inputA').value || teams.A;
    teams.B = document.getElementById('inputB').value || teams.B;
    teams.C = document.getElementById('inputC').value || teams.C;
    document.getElementById('settingsPanel').className = '';
    renderNames();
    saveStorage();
  }

  // init
  loadStorage();
  setMode(mode);
</script>
</body>
</html>
